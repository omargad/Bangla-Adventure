# Single application instance behind an HTTPS reverse proxy on this host.
# Set PUBLIC_ORIGIN to the real https:// address before starting.
# Keep the same Compose project name across upgrades to reuse its data volume.
# Builds the image here by default; APP_IMAGE runs a published one instead (scripts/deploy-remote.sh
# sets it, and `docker compose up --no-build` then uses it without the source code).
services:
  app:
    build:
      context: .
    image: ${APP_IMAGE:-bangla-adventures:local}
    init: true
    # The app runs as the image's unprivileged user; the named volume already belongs to it.
    user: node
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: "3000"
      PLATFORM_MODE: legacy
      DATABASE_PATH: /app/.data/bangla-adventures.db
      MEDIA_ROOT: /app/.data/media
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS address}
      NEXT_TELEMETRY_DISABLED: "1"
      # Proxies that append to X-Forwarded-For in front of the app; empty means one (the Nginx site).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
      # Optional server-side narration; bundled audio needs no provider credential.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
      ELEVENLABS_DAILY_CHARACTER_LIMIT: ${ELEVENLABS_DAILY_CHARACTER_LIMIT:-}
      ELEVENLABS_ACCOUNT_DAILY_CHARACTER_LIMIT: ${ELEVENLABS_ACCOUNT_DAILY_CHARACTER_LIMIT:-}
    ports:
      # The prepared VPS sets APP_PORT=3001; preserve port 3000 for existing installs.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - bangla-data:/app/.data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bangla-data:
