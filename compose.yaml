# Single application instance behind an HTTPS reverse proxy on this host.
# Set PUBLIC_ORIGIN to the real https:// address before starting.
# Keep the same Compose project name across upgrades to reuse its data volume.
services:
  app:
    build:
      context: .
    image: bangla-adventures:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: "3000"
      PLATFORM_MODE: legacy
      DATABASE_PATH: /app/.data/bangla-adventures.db
      MEDIA_ROOT: /app/.data/media
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS address}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - bangla-data:/app/.data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bangla-data:
