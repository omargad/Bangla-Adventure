name: VPS production status

# Daily read-only check of the production backup, monitoring and off-site results on the VPS
# (docs/PRODUCTION_OPERATIONS.md). A failing or stale result fails the run, so GitHub notifies the
# owner. Skipped unless the repository variable DEPLOY_ENABLED is 'true' (production exists).
# It uses the "production-status" environment, which has no required reviewers so the daily check
# never waits for a deploy approval. That environment must allow only main and holds the
# STATUS_SSH_KEY secret: a separate key whose public line, the repository variable
# STATUS_SSH_PUBLIC_KEY, the reviewer-approved install restricts to running status. It never
# receives the deploy key. An environment sees only its own and the repository's settings, so
# DEPLOY_HOST, DEPLOY_USER (secrets) and DEPLOY_KNOWN_HOSTS (variable) kept on the production
# environment must be added to production-status too. DEPLOY_KNOWN_HOSTS is passed only when the
# DEPLOY_HOST secret is present, so a missing or misnamed secret never prints an unmasked address.
# Like every vps-*.yml workflow, it contacts the server only from the production repository, recognised
# by its numeric ID (github.repository_id): see vps-ssh-preflight.yml and docs/REPOSITORY_TRANSFER.md.
# Anywhere else with DEPLOY_ENABLED=true, the other-repository job reports why the check did not
# run (an error that fails the run, or a notice in a fork), so a daily check that could not run is
# never only skipped.

on:
  schedule:
    # 19:41 UTC: after the 16:30 backup and the 17:15 off-site copy, and away from busy :00 slots.
    - cron: '41 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-status
  cancel-in-progress: false

jobs:
  other-repository:
    if: >-
      github.repository_id != (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain why the server was not contacted
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          PRODUCTION_ID: ${{ vars.PRODUCTION_REPOSITORY_ID || '1436643374' }}
          FORK: ${{ github.event.repository.fork }}
        run: |
          if [ "$FORK" = true ]; then
            printf '::notice title=Server jobs skipped in a fork::A fork never contacts the server or loads its credentials. Nothing needs to be set here.\n'
            exit 0
          fi
          printf '::error title=Not the production repository::No server job ran. This repository has ID %s; the server jobs run only in the repository with ID %s. A transfer or rename keeps the ID, and a copy of the project needs nothing. If this is the production repository created again under a new ID, set the repository variable PRODUCTION_REPOSITORY_ID to %s (docs/REPOSITORY_TRANSFER.md).\n' "$REPOSITORY_ID" "$PRODUCTION_ID" "$REPOSITORY_ID"
          exit 1

  status:
    if: github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-status
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check production operations status
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          PRODUCTION_REPOSITORY_ID: ${{ vars.PRODUCTION_REPOSITORY_ID }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bangla-adventures' }}
          DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || 'SHA256:79xe+ubCodL2ACAHPNloo7I/K6mvngU88vEiFoEeWL8' }}
          DEPLOY_KEY_FINGERPRINT: ${{ vars.DEPLOY_KEY_FINGERPRINT || 'SHA256:y1+C6cvcfpJFmO8pfjyMSFERpd5BtcQyDf5SptZXVlQ' }}
          DEPLOY_DOCKER_HOST: ${{ vars.DEPLOY_DOCKER_HOST || (vars.DEPLOY_DOCKER_CONTEXT == '' && 'unix:///run/user/1002/docker.sock') || '' }}
          DEPLOY_DOCKER_CONTEXT: ${{ vars.DEPLOY_DOCKER_CONTEXT }}
          # Passed only with the address secret, which masks the address inside the line.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST != '' && vars.DEPLOY_KNOWN_HOSTS || '' }}
          STATUS_SSH_KEY: ${{ secrets.STATUS_SSH_KEY }}
          STATUS_SSH_PUBLIC_KEY: ${{ vars.STATUS_SSH_PUBLIC_KEY }}
        run: bash scripts/production-ops-controller.sh scheduled-status
