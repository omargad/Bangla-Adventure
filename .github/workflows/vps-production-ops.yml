name: VPS production operations

# Like every vps-*.yml workflow, it contacts the server only from the production repository, recognised
# by its numeric ID (github.repository_id): see vps-ssh-preflight.yml and docs/REPOSITORY_TRANSFER.md.
# When a server job is requested anywhere else, the other-repository job says why nothing ran: a
# notice in a fork, and an error that fails the run in any other repository.

# Installs (or updates) and proves the production backup, monitoring and off-site timers on the VPS,
# shows their status, or takes a backup now (docs/PRODUCTION_OPERATIONS.md). Production must exist
# first: every job is skipped unless the repository variable DEPLOY_ENABLED is 'true'. The server's
# address and account are the DEPLOY_HOST and DEPLOY_USER secrets (repository or production
# environment), never printed. install also adds the daily status check's key, from the repository
# variable STATUS_SSH_PUBLIC_KEY, to the server's authorized_keys, restricted to running status. The
# validate job shows that request before the reviewer approves, and install refuses unless it reads
# the same request after the approval.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "install (or update) the timers and prove them, status, or backup-now. Needs production enabled (DEPLOY_ENABLED=true)."
        type: choice
        required: true
        default: status
        options:
          - install
          - status
          - backup-now
      confirm:
        description: Run this operation on the production server
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: production-operations
  cancel-in-progress: false

jobs:
  other-repository:
    if: >-
      github.repository_id != (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true' && inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain why the server was not contacted
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          PRODUCTION_ID: ${{ vars.PRODUCTION_REPOSITORY_ID || '1436643374' }}
          FORK: ${{ github.event.repository.fork }}
        run: |
          if [ "$FORK" = true ]; then
            printf '::notice title=Server jobs skipped in a fork::A fork never contacts the server or loads its credentials. Nothing needs to be set here.\n'
            exit 0
          fi
          printf '::error title=Not the production repository::No server job ran. This repository has ID %s; the server jobs run only in the repository with ID %s. A transfer or rename keeps the ID, and a copy of the project needs nothing. If this is the production repository created again under a new ID, set the repository variable PRODUCTION_REPOSITORY_ID to %s (docs/REPOSITORY_TRANSFER.md).\n' "$REPOSITORY_ID" "$PRODUCTION_ID" "$REPOSITORY_ID"
          exit 1

  validate:
    if: >-
      github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true' && inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status_key: ${{ steps.status_key.outputs.status_key }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check the operations tools offline before loading any credential
        run: |
          set -euo pipefail
          bash -n scripts/production-ops.sh scripts/production-ops-install.sh scripts/production-ops-controller.sh
          python3 -m unittest discover -s tests -p 'production_ops_test.py' -v
      # Before the approval, so the reviewer sees which status key install would authorize.
      - id: status_key
        name: Show the status key change for the reviewer
        if: inputs.action == 'install'
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          PRODUCTION_REPOSITORY_ID: ${{ vars.PRODUCTION_REPOSITORY_ID }}
          DEPLOY_KEY_FINGERPRINT: ${{ vars.DEPLOY_KEY_FINGERPRINT || 'SHA256:y1+C6cvcfpJFmO8pfjyMSFERpd5BtcQyDf5SptZXVlQ' }}
          STATUS_SSH_PUBLIC_KEY: ${{ vars.STATUS_SSH_PUBLIC_KEY }}
        run: bash scripts/production-ops-controller.sh status-key-request

  operate:
    needs: validate
    if: >-
      github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true' && inputs.confirm == true && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run the production operation
        env:
          OPERATION: ${{ inputs.action }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          PRODUCTION_REPOSITORY_ID: ${{ vars.PRODUCTION_REPOSITORY_ID }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bangla-adventures' }}
          DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || 'SHA256:79xe+ubCodL2ACAHPNloo7I/K6mvngU88vEiFoEeWL8' }}
          DEPLOY_KEY_FINGERPRINT: ${{ vars.DEPLOY_KEY_FINGERPRINT || 'SHA256:y1+C6cvcfpJFmO8pfjyMSFERpd5BtcQyDf5SptZXVlQ' }}
          DEPLOY_DOCKER_HOST: ${{ vars.DEPLOY_DOCKER_HOST || (vars.DEPLOY_DOCKER_CONTEXT == '' && 'unix:///run/user/1002/docker.sock') || '' }}
          DEPLOY_DOCKER_CONTEXT: ${{ vars.DEPLOY_DOCKER_CONTEXT }}
          # Passed only with the address secret, which masks the address inside the line.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST != '' && vars.DEPLOY_KNOWN_HOSTS || '' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STATUS_SSH_PUBLIC_KEY: ${{ vars.STATUS_SSH_PUBLIC_KEY }}
          APPROVED_STATUS_KEY: ${{ needs.validate.outputs.status_key }}
        run: bash scripts/production-ops-controller.sh "$OPERATION"
