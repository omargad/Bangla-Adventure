name: VPS SSH preflight

# Like every vps-*.yml workflow, it loads the server's credentials and contacts the server, so its
# jobs run only in the production repository, never in a fork or a copy of it. That repository is
# recognised by its numeric ID (github.repository_id, 1436643374), not by its name: a transfer to
# another account or a rename keeps the ID, while a fork or a copy always has a new one, so no owner
# name is written here and the workflows keep working after the move to the client's organisation
# with no new setting. Only if the production repository were ever created again (a new ID) would
# the repository variable PRODUCTION_REPOSITORY_ID name the new ID (docs/REPOSITORY_TRANSFER.md).
# When a server job is requested anywhere else, the other-repository job says why nothing ran: a
# notice in a fork, and an error that fails the run in any other repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  other-repository:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_id != (vars.PRODUCTION_REPOSITORY_ID || '1436643374') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain why the server was not contacted
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          PRODUCTION_ID: ${{ vars.PRODUCTION_REPOSITORY_ID || '1436643374' }}
          FORK: ${{ github.event.repository.fork }}
        run: |
          if [ "$FORK" = true ]; then
            printf '::notice title=Server jobs skipped in a fork::A fork never contacts the server or loads its credentials. Nothing needs to be set here.\n'
            exit 0
          fi
          printf '::error title=Not the production repository::No server job ran. This repository has ID %s; the server jobs run only in the repository with ID %s. A transfer or rename keeps the ID, and a copy of the project needs nothing. If this is the production repository created again under a new ID, set the repository variable PRODUCTION_REPOSITORY_ID to %s (docs/REPOSITORY_TRANSFER.md).\n' "$REPOSITORY_ID" "$PRODUCTION_ID" "$REPOSITORY_ID"
          exit 1

  repository-settings:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Require the repository deployment gate to remain disabled
        shell: bash
        env:
          REPOSITORY_DEPLOY_ENABLED_STATE: ${{ (vars.DEPLOY_ENABLED == '' || vars.DEPLOY_ENABLED == 'false') && 'disabled' || vars.DEPLOY_ENABLED == 'true' && 'enabled' || 'unexpected' }}
          REPOSITORY_DEPLOY_HOST_STATE: ${{ secrets.DEPLOY_HOST == '' && 'unset' || 'set' }}
          REPOSITORY_DEPLOY_USER_STATE: ${{ secrets.DEPLOY_USER == '' && 'unset' || 'set' }}
        run: |
          set -euo pipefail
          printf 'repository gate scope (production environment not loaded): DEPLOY_ENABLED=%s; repository-level DEPLOY_HOST=%s; DEPLOY_USER=%s (unset is expected when they are production environment secrets).\n' "$REPOSITORY_DEPLOY_ENABLED_STATE" "$REPOSITORY_DEPLOY_HOST_STATE" "$REPOSITORY_DEPLOY_USER_STATE"
          if [ "$REPOSITORY_DEPLOY_ENABLED_STATE" != disabled ]; then
            printf '::error::Repository DEPLOY_ENABLED must be absent or exactly false before this preflight may contact the VPS.\n'
            exit 1
          fi

  ssh-preflight:
    needs: repository-settings
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Reject misplaced private credentials
        if: ${{ contains(vars.DEPLOY_KNOWN_HOSTS, 'PRIVATE KEY') || contains(vars.DEPLOY_KNOWN_HOSTS, '-----BEGIN') }}
        shell: bash
        run: |
          printf '::error::DEPLOY_KNOWN_HOSTS must contain only verified server public host-key lines. Store the private deployment key only in DEPLOY_SSH_KEY.\n'
          exit 1
      - name: Verify pinned SSH access and rootless Docker
        if: ${{ success() }}
        shell: bash
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Passed only with the address secret, which masks the address inside the line.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST != '' && vars.DEPLOY_KNOWN_HOSTS || '' }}
        run: |
          set -euo pipefail
          umask 077
          fail() { printf 'preflight: %s\n' "$*" >&2; exit 1; }
          [ "${DEPLOY_ENABLED:-false}" = false ] || fail 'DEPLOY_ENABLED must remain false during this read-only preflight.'
          [[ "${DEPLOY_HOST:-}" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || fail 'the DEPLOY_HOST secret is missing or invalid (set it as a repository secret or a production environment secret, named exactly DEPLOY_HOST).'
          [[ "${DEPLOY_USER:-}" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || fail 'the DEPLOY_USER secret is missing or invalid (set it as a repository secret or a production environment secret, named exactly DEPLOY_USER).'
          [ -n "${DEPLOY_SSH_KEY:-}" ] || fail 'production secret DEPLOY_SSH_KEY is missing.'
          [ -n "${DEPLOY_KNOWN_HOSTS:-}" ] || fail 'production variable DEPLOY_KNOWN_HOSTS is missing.'

          readonly host="$DEPLOY_HOST"
          readonly user="$DEPLOY_USER"
          readonly port='22'
          readonly key_pin='SHA256:y1+C6cvcfpJFmO8pfjyMSFERpd5BtcQyDf5SptZXVlQ'
          readonly host_pin='SHA256:79xe+ubCodL2ACAHPNloo7I/K6mvngU88vEiFoEeWL8'
          work="$(mktemp -d)"
          chmod 700 "$work"
          trap 'rm -rf -- "$work"' EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$work/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$work/provided_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          chmod 600 "$work/key" "$work/provided_hosts"

          ssh-keygen -y -P '' -f "$work/key" > "$work/public_key" 2>/dev/null || fail 'DEPLOY_SSH_KEY must be a readable, unencrypted CI deployment key.'
          actual="$(ssh-keygen -l -E sha256 -f "$work/public_key" 2>/dev/null | awk '{print $2}')" || fail 'Could not fingerprint the deployment key.'
          [ "$actual" = "$key_pin" ] || fail 'The deployment key does not match the supplied public-key fingerprint.'
          : > "$work/known_hosts"
          while IFS= read -r line || [ -n "$line" ]; do
            [[ "$line" =~ ^[[:space:]]*(#|$) ]] && continue
            [[ "$line" =~ ^[[:space:]]*@ ]] && fail 'known_hosts markers are not permitted; supply the pinned server public key directly.'
            IFS=$' \t' read -r hostnames key_type key_data _ <<< "$line"
            [ -n "$hostnames" ] || fail 'DEPLOY_KNOWN_HOSTS is not in known_hosts format.'
            case "$key_type" in
              ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521) ;;
              *) fail 'DEPLOY_KNOWN_HOSTS is not in known_hosts format.' ;;
            esac
            [[ "$key_data" =~ ^[a-zA-Z0-9+/]+={0,2}$ ]] || fail 'DEPLOY_KNOWN_HOSTS has invalid public-key encoding.'
            printf '%s\n' "$line" > "$work/host_line"
            actual="$(ssh-keygen -l -E sha256 -f "$work/host_line" 2>/dev/null | awk '{print $2}')" || fail 'DEPLOY_KNOWN_HOSTS contains an invalid host-key line.'
            [ "$actual" = "$host_pin" ] || fail 'DEPLOY_KNOWN_HOSTS contains a host key that does not match the supplied server fingerprint.'
            printf '%s\n' "$line" >> "$work/known_hosts"
          done < "$work/provided_hosts"
          [ -s "$work/known_hosts" ] || fail 'DEPLOY_KNOWN_HOSTS has no pinned server key.'
          ssh-keygen -F "$host" -f "$work/known_hosts" >/dev/null 2>&1 || fail 'The pinned known_hosts entry does not cover the deployment server on port 22.'
          chmod 600 "$work/known_hosts" "$work/public_key" "$work/host_line"
          printf 'preflight: deployment key and server host-key fingerprints verified.\n'

          quoted() { printf "'%s'" "${1//\'/\'\\\'\'}"; }
          for attempt in 1 2 3; do
            if ssh -F /dev/null -T -i "$work/key" -p "$port" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
              -o UpdateHostKeys=no -o GlobalKnownHostsFile=/dev/null \
              -o "UserKnownHostsFile=$work/known_hosts" \
              -o ForwardAgent=no -o ClearAllForwardings=yes \
              -o PermitLocalCommand=no -o ControlMaster=no -o ControlPath=none \
              -o ConnectTimeout=15 -o ConnectionAttempts=1 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
              "$user@$host" "bash -s -- $(quoted "$user")" <<'REMOTE'
          set -euo pipefail
          fail() { printf 'preflight: %s\n' "$*" >&2; exit 1; }
          readonly expected_user="${1:?The expected deployment user is required.}"
          [ "$(id -un)" = "$expected_user" ] || fail 'SSH connected as an unexpected user.'
          # The login name comes from the runner; UID 1002 pins the account itself.
          [ "$(id -u)" = 1002 ] || fail 'The deployment user does not have the expected UID 1002.'
          test -d /opt/bangla-adventures || fail 'The deployment directory is missing.'
          test -w /opt/bangla-adventures || fail 'The deployment directory is not writable by the deployment user.'
          readonly docker_socket='unix:///run/user/1002/docker.sock'
          security_options="$(docker --host "$docker_socket" info --format '{{json .SecurityOptions}}')" || fail 'The prepared Docker daemon is not accessible.'
          case "$security_options" in
            *'"name=rootless"'*) ;;
            *) fail 'The prepared Docker daemon does not report rootless mode.' ;;
          esac
          compose_version="$(docker --host "$docker_socket" compose version --short)" || fail 'Docker Compose is not available.'
          printf 'preflight: server architecture %s; online CPUs %s.\n' "$(uname -m)" "$(getconf _NPROCESSORS_ONLN)"
          awk '$1 == "MemTotal:" || $1 == "MemAvailable:" { printf "preflight: %s %s KiB.\n", $1, $2 }' /proc/meminfo
          df -Pk -- /opt/bangla-adventures | awk 'NR == 2 { printf "preflight: deployment filesystem size %s KiB; available %s KiB.\n", $2, $4 }'
          printf 'preflight: authenticated as the configured deployment user (UID 1002); deployment directory exists and is writable.\n'
          printf 'preflight: the prepared Docker daemon reports rootless mode.\n'
          printf 'preflight: Docker Compose version %s.\n' "$compose_version"
          REMOTE
            then
              break
            fi
            status=$?
            if [ "$attempt" -ge 3 ] || [ "$status" -ne 255 ]; then
              exit "$status"
            fi
            printf 'preflight: SSH connection attempt %s/3 failed (exit %s); retrying in 5 seconds.\n' "$attempt" "$status" >&2
            sleep 5
          done
          printf 'preflight: read-only SSH checks passed; no application deployment was performed.\n'
