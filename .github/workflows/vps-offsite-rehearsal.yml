name: VPS off-site rehearsal

# Like every vps-*.yml workflow, it contacts the server only from the production repository, recognised
# by its numeric ID (github.repository_id): see vps-ssh-preflight.yml and docs/REPOSITORY_TRANSFER.md.
# When a server job is requested anywhere else, the other-repository job says why nothing ran: a
# notice in a fork, and an error that fails the run in any other repository.

# Rehearses the production off-site copy on the VPS without any client credential
# (docs/PRODUCTION_OPERATIONS.md#off-site-rehearsal): the newest verified private staging archive is
# backed up into a throwaway encrypted restic repository on the server, checked with --read-data,
# previewed for the proposed retention, restored and compared, then removed. Nothing leaves the
# server. Like private staging, it runs only while production deployment is disabled, and it shares
# their concurrency group, so it never runs alongside a staging start or an acceptance run.

on:
  workflow_dispatch:
    inputs:
      confirm_offsite_rehearsal:
        description: Rehearse the off-site copy on the VPS with a throwaway local repository (no client credentials; staging data is only read)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: vps-private-staging
  cancel-in-progress: false

jobs:
  other-repository:
    if: >-
      github.repository_id != (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' &&
      inputs.confirm_offsite_rehearsal == true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain why the server was not contacted
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          PRODUCTION_ID: ${{ vars.PRODUCTION_REPOSITORY_ID || '1436643374' }}
          FORK: ${{ github.event.repository.fork }}
        run: |
          if [ "$FORK" = true ]; then
            printf '::notice title=Server jobs skipped in a fork::A fork never contacts the server or loads its credentials. Nothing needs to be set here.\n'
            exit 0
          fi
          printf '::error title=Not the production repository::No server job ran. This repository has ID %s; the server jobs run only in the repository with ID %s. A transfer or rename keeps the ID, and a copy of the project needs nothing. If this is the production repository created again under a new ID, set the repository variable PRODUCTION_REPOSITORY_ID to %s (docs/REPOSITORY_TRANSFER.md).\n' "$REPOSITORY_ID" "$PRODUCTION_ID" "$REPOSITORY_ID"
          exit 1

  validate:
    if: >-
      github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' &&
      inputs.confirm_offsite_rehearsal == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check the rehearsal tools offline before loading any credential
        run: |
          set -euo pipefail
          bash -n scripts/private-staging-offsite-rehearsal.sh
          python3 -m py_compile scripts/private-staging-offsite-rehearsal.py scripts/private-staging-ops.py scripts/production-ops.py
          python3 -m unittest discover -s tests -p 'private_staging_offsite_rehearsal_test.py' -v

  repository-settings:
    if: >-
      github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' &&
      inputs.confirm_offsite_rehearsal == true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require repository production deployment to remain disabled before loading its environment
        env:
          REPOSITORY_DEPLOY_ENABLED_STATE: ${{ (vars.DEPLOY_ENABLED == '' || vars.DEPLOY_ENABLED == 'false') && 'disabled' || 'refused' }}
        run: |
          set -euo pipefail
          [ "$REPOSITORY_DEPLOY_ENABLED_STATE" = disabled ] || { printf '::error::Repository DEPLOY_ENABLED must be unset or exactly false.\n'; exit 1; }

  rehearsal:
    needs: [repository-settings, validate]
    if: >-
      github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' &&
      needs.repository-settings.result == 'success' && needs.validate.result == 'success' &&
      inputs.confirm_offsite_rehearsal == true
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Rehearse the off-site copy with a throwaway repository on the VPS
        env:
          CONFIRM_OFFSITE_REHEARSAL: ${{ inputs.confirm_offsite_rehearsal }}
          REPOSITORY_GATE_CONFIRMED: disabled
          PRODUCTION_REPOSITORY_ID: ${{ vars.PRODUCTION_REPOSITORY_ID }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Passed only with the address secret, which masks the address inside the line.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST != '' && vars.DEPLOY_KNOWN_HOSTS || '' }}
          OFFSITE_REHEARSAL_EVIDENCE_DIR: ${{ runner.temp }}/offsite-rehearsal-evidence
        run: bash scripts/private-staging-offsite-rehearsal.sh
      - name: Retain the rehearsal summary and result
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: offsite-rehearsal
          path: ${{ runner.temp }}/offsite-rehearsal-evidence/
          if-no-files-found: ignore
          retention-days: 30
