name: VPS private acceptance

# Like every vps-*.yml workflow, it contacts the server only from the production repository, recognised
# by its numeric ID (github.repository_id): see vps-ssh-preflight.yml and docs/REPOSITORY_TRANSFER.md.
# When a server job is requested anywhere else, the other-repository job says why nothing ran: a
# notice in a fork, and an error that fails the run in any other repository.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vps-acceptance.yml
      - scripts/private-staging-acceptance.sh
      - scripts/private-staging-qa.sh
      - scripts/private-staging-rollback.sh
      - scripts/private-staging-ops*
      - deploy/private-staging-ops/**
      - tests/staging/browser-role-acceptance.mjs
      - tests/staging/role-acceptance-scenario.mjs
      - tests/acceptance/**
      - playwright.acceptance.config.ts
      - tests/private_staging_acceptance_controller_test.py
  workflow_dispatch:
    inputs:
      confirm_acceptance:
        description: Exercise only private operational checks and disposable rollback/classroom QA
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Exclude the older private-stage workflow and all acceptance runs from each other.
concurrency:
  group: vps-private-staging
  cancel-in-progress: false

jobs:
  other-repository:
    if: >-
      github.repository_id != (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[vps-acceptance-run]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm_acceptance == true))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain why the server was not contacted
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          PRODUCTION_ID: ${{ vars.PRODUCTION_REPOSITORY_ID || '1436643374' }}
          FORK: ${{ github.event.repository.fork }}
        run: |
          if [ "$FORK" = true ]; then
            printf '::notice title=Server jobs skipped in a fork::A fork never contacts the server or loads its credentials. Nothing needs to be set here.\n'
            exit 0
          fi
          printf '::error title=Not the production repository::No server job ran. This repository has ID %s; the server jobs run only in the repository with ID %s. A transfer or rename keeps the ID, and a copy of the project needs nothing. If this is the production repository created again under a new ID, set the repository variable PRODUCTION_REPOSITORY_ID to %s (docs/REPOSITORY_TRANSFER.md).\n' "$REPOSITORY_ID" "$PRODUCTION_ID" "$REPOSITORY_ID"
          exit 1

  validate:
    if: github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install runner dependencies without environment credentials
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Check available acceptance helpers and offline isolation tests
        run: |
          set -euo pipefail
          for script in scripts/private-staging-{acceptance,rollback,ops,ops-install,qa}.sh; do
            if [ -f "$script" ]; then bash -n "$script"; fi
          done
          node --check tests/staging/browser-role-acceptance.mjs
          node --check tests/staging/role-acceptance-scenario.mjs
          python3 -m unittest discover -s tests -p 'private_staging_*test.py' -v
          node --import tsx --test tests/private-staging*.test.mjs
          node <<'JS'
          const f=require("node:fs"),y=require("js-yaml");
          const x=y.load(f.readFileSync(".github/workflows/vps-acceptance.yml","utf8"));
          if(x.jobs.acceptance.environment!=="production"||!x.jobs.acceptance.needs.includes("validate")||!x.jobs.acceptance.needs.includes("repository-settings"))throw Error("Missing pre-SSH gates");
          const ci=y.load(f.readFileSync(".github/workflows/ci.yml","utf8"));
          const deploy=ci.jobs.deploy.steps.filter(s=>s.env&&Object.hasOwn(s.env,"DEPLOY_REQUIRE_ROOTLESS"));
          if(deploy.length!==1||deploy[0].env.DEPLOY_REQUIRE_ROOTLESS!=="true"||deploy[0].env.DEPLOY_REQUIRE_PUBLIC_HEALTH!=="true")throw Error("Fixed production rootless/public-health gates changed");
          JS
      - name: Run the exact four-role scenario against a fresh local production server before SSH
        env:
          NODE_NO_WARNINGS: '1'
        run: npx playwright test -c playwright.acceptance.config.ts --project=chromium

      - name: Retain only synthetic local scenario screenshots and fixed diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: private-acceptance-local
          path: |
            test-results/**/role-acceptance-*/*.png
            test-results/**/role-acceptance-*/ci-result.json
            test-results/**/role-acceptance-*/ci-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7

  repository-settings:
    if: >-
      github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[vps-acceptance-run]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm_acceptance == true))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require repository production deployment to remain disabled before loading its environment
        env:
          REPOSITORY_DEPLOY_ENABLED_STATE: ${{ (vars.DEPLOY_ENABLED == '' || vars.DEPLOY_ENABLED == 'false') && 'disabled' || 'refused' }}
        run: |
          set -euo pipefail
          [ "$REPOSITORY_DEPLOY_ENABLED_STATE" = disabled ] || { printf '::error::Repository DEPLOY_ENABLED must be unset or exactly false.\n'; exit 1; }

  acceptance:
    needs: [repository-settings, validate]
    if: >-
      github.repository_id == (vars.PRODUCTION_REPOSITORY_ID || '1436643374') && github.ref == 'refs/heads/main' &&
      needs.repository-settings.result == 'success' && needs.validate.result == 'success' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[vps-acceptance-run]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm_acceptance == true))
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install private runner browser dependencies before loading SSH credentials
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise existing private staging, disposable failed-release rollback and four-role QA
        env:
          REPOSITORY_GATE_CONFIRMED: disabled
          PRODUCTION_REPOSITORY_ID: ${{ vars.PRODUCTION_REPOSITORY_ID }}
          STAGING_IMAGE_REPOSITORY: ${{ vars.STAGING_IMAGE_REPOSITORY }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Passed only with the address secret, which masks the address inside the line.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST != '' && vars.DEPLOY_KNOWN_HOSTS || '' }}
          PRIVATE_ACCEPTANCE_EVIDENCE_DIR: ${{ runner.temp }}/private-acceptance-evidence
          NODE_NO_WARNINGS: '1'
        run: bash scripts/private-staging-acceptance.sh
      - name: Retain only sanitized acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: private-staging-acceptance
          path: ${{ runner.temp }}/private-acceptance-evidence/
          if-no-files-found: ignore
          retention-days: 7
