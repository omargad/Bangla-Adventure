name: CI

# Every job runs one of the shared scripts in scripts/ci, which GitLab (.gitlab-ci.yml) and
# Jenkins (Jenkinsfile) run too. On the default branch the tested image is published to
# ghcr.io/<owner>/<repository> and, once the server is configured, deployed to it
# (docs/DEPLOYMENT.md "Automatic deployment").

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/ci/verify.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/ci/e2e.sh
      - name: Retain browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build the production image and run the container smoke test
        env:
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/ci/container.sh bangla-adventures:ci
      # Each tested image is kept under its commit; it is only marked latest and deployed once
      # every job has passed. A manual run publishes from any branch, for checking the setup.
      - name: Publish this commit's image
        if: (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish.sh push bangla-adventures:ci "${{ steps.name.outputs.image }}:sha-${GITHUB_SHA}"

  publish:
    needs: [verify, e2e, container]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Runs on the default branch can finish in any order, and re-running an old run's failed jobs
      # would publish its older commit again, so only the branch's newest commit goes on.
      - id: current
        name: Check this is the newest commit on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if bash scripts/ci/newest.sh "$BRANCH"; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mark the tested image as latest
        if: steps.current.outputs.newest == 'true'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.container.outputs.image }}
        run: bash scripts/ci/publish.sh promote "$IMAGE:sha-${GITHUB_SHA}" "$IMAGE:latest"

  # Disabled until repository variables DEPLOY_ENABLED=true AND DEPLOY_HOST are set. This gate
  # runs before the production environment loads; public defaults below never enable deployment.
  # Add required reviewers to the "production" environment to approve each deploy.
  deploy:
    needs: [container, publish]
    if: vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      # As in publish: an older commit is never deployed over a newer one.
      - id: current
        name: Check this is the newest commit on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if bash scripts/ci/newest.sh "$BRANCH"; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to the server
        if: steps.current.outputs.newest == 'true'
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deployer' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bangla-adventures' }}
          DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || 'SHA256:79xe+ubCodL2ACAHPNloo7I/K6mvngU88vEiFoEeWL8' }}
          DEPLOY_KEY_FINGERPRINT: ${{ vars.DEPLOY_KEY_FINGERPRINT || 'SHA256:y1+C6cvcfpJFmO8pfjyMSFERpd5BtcQyDf5SptZXVlQ' }}
          DEPLOY_DOCKER_HOST: ${{ vars.DEPLOY_DOCKER_HOST || (vars.DEPLOY_DOCKER_CONTEXT == '' && 'unix:///run/user/1002/docker.sock') || '' }}
          DEPLOY_DOCKER_CONTEXT: ${{ vars.DEPLOY_DOCKER_CONTEXT }}
          DEPLOY_REQUIRE_ROOTLESS: 'true'
          DEPLOY_REQUIRE_PUBLIC_HEALTH: 'true'
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.container.outputs.image }}
        run: bash scripts/deploy.sh "$IMAGE:sha-${GITHUB_SHA}"
