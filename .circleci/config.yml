# The same pipeline as .github/workflows/ci.yml, for CircleCI: each job runs one of the shared scripts
# in scripts/ci (docs/DEPLOYMENT.md "Automatic deployment").
# CircleCI has no container registry, so on the default branch the tested image is published to the
# one named by REGISTRY_IMAGE (lowercase, for example docker.io/OWNER/bangla-adventures), signing in
# with REGISTRY_USER and REGISTRY_PASSWORD, and deployed once DEPLOY_ENABLED=true and DEPLOY_HOST are set. Set them in
# the context bangla-release (Organization Settings > Contexts), restricted to the default branch:
# only the default branch's container, promote and deploy jobs use it, so no other job or branch
# receives them. Create that context, even empty, before the default branch's first build. The
# deploy settings are listed above the deploy job.
# The container job runs on a Linux VM with its own Docker, so the container test runs in full.

version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23
    resource_class: medium

commands:
  # Checks out the code and runs a script, keeping npm's download cache between runs.
  with-npm-cache:
    parameters:
      script:
        type: string
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: << parameters.script >>
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  verify:
    executor: node
    steps:
      - with-npm-cache:
          script: bash scripts/ci/verify.sh

  e2e:
    executor: node
    steps:
      - with-npm-cache:
          script: bash scripts/ci/e2e.sh

  container:
    machine:
      image: ubuntu-2604:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build the production image and run the container smoke test
          environment:
            IMAGE_SOURCE: << pipeline.project.git_url >>
          command: bash scripts/ci/container.sh bangla-adventures:ci
      # Each tested image is kept under its commit; it is only marked latest and deployed once
      # every job has passed.
      - when:
          condition: << pipeline.git.branch.is_default >>
          steps:
            - run:
                name: Publish this commit's image
                command: |
                  if [ -n "${REGISTRY_IMAGE:-}" ]; then
                    bash scripts/ci/publish.sh push bangla-adventures:ci "$REGISTRY_IMAGE:sha-$CIRCLE_SHA1"
                  fi

  # Pipelines can finish in any order, and re-running an old one would publish its older commit
  # again, so only the newest commit on the default branch is marked latest and deployed.
  promote:
    executor: node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Mark the tested image as latest
          command: |
            if [ -z "${REGISTRY_IMAGE:-}" ]; then
              echo "REGISTRY_IMAGE is not set, so no image is published."
            elif bash scripts/ci/newest.sh "$CIRCLE_BRANCH"; then
              bash scripts/ci/publish.sh promote "$REGISTRY_IMAGE:sha-$CIRCLE_SHA1" "$REGISTRY_IMAGE:latest"
            else
              status=$?
              [ "$status" -eq 1 ] || exit "$status"
            fi

  # Needs DEPLOY_ENABLED=true, DEPLOY_HOST, DEPLOY_SSH_KEY_BASE64 and DEPLOY_KNOWN_HOSTS_BASE64 (plus DEPLOY_USER, DEPLOY_PORT
  # and DEPLOY_PATH when they differ from the defaults). The key and the host key lines are given
  # base64-encoded on one line: base64 -w0 < FILE (on macOS, base64 -i FILE).
  deploy:
    executor: node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Deploy to the server
          command: |
            if [ "${DEPLOY_ENABLED:-false}" != true ] || [ -z "${REGISTRY_IMAGE:-}" ] || [ -z "${DEPLOY_HOST:-}" ]; then
              echo "Deployment requires DEPLOY_ENABLED=true, REGISTRY_IMAGE and DEPLOY_HOST; nothing is deployed."
            elif bash scripts/ci/newest.sh "$CIRCLE_BRANCH"; then
              bash scripts/deploy.sh "$REGISTRY_IMAGE:sha-$CIRCLE_SHA1"
            else
              status=$?
              [ "$status" -eq 1 ] || exit "$status"
            fi

workflows:
  ci:
    jobs:
      - verify
      - e2e
      - container:
          filters: not pipeline.git.branch.is_default
      # The same job on the default branch, with the settings to publish its image.
      - container:
          name: container-release
          context: bangla-release
          filters: pipeline.git.branch.is_default
      - promote:
          context: bangla-release
          requires: [verify, e2e, container-release]
          filters: pipeline.git.branch.is_default
      # One deploy at a time; a newer pipeline's deploy makes an older one waiting for it skip.
      - deploy:
          context: bangla-release
          requires: [promote]
          filters: pipeline.git.branch.is_default
          serial-group: << pipeline.project.slug >>/production
